version: 1
swimlanes:
  warehouse:
    name: Warehouse
  carrier:
    name: Carrier
processes:
  pick-items:
    name: Pick items
    lane: warehouse
    type: start
  pack-items:
    name: Pack items
    lane: warehouse
  print-label:
    name: Print label
    lane: warehouse
  hand-over:
    name: Hand over to carrier
    lane: carrier
  deliver:
    name: Deliver
    lane: carrier
    type: end
flows:
  - from: pick-items
    to: pack-items
  - from: pack-items
    to: print-label
  - from: print-label
    to: hand-over
  - from: hand-over
    to: deliver
